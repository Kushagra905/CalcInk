name: CalcInk Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calcink-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      upload_pages: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-public:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify published version and asset hashes
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.page_url }}
          CALCINK_EXPECTED_VERSION: ${{ needs.build.outputs.offline_version }}
        run: |
          for attempt in 1 2 3; do
            npm run verify:deployed -- "$DEPLOYMENT_URL" && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - run: npx playwright install --with-deps chromium
      - name: Verify disconnected public reload with real recognition
        env:
          CALCINK_PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
          CALCINK_EXPECTED_VERSION: ${{ needs.build.outputs.offline_version }}
        run: npm run test:public
