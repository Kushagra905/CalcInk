name: CalcInk checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      upload_pages:
        description: Upload the verified production build for the Pages publishing job.
        type: boolean
        default: false
    outputs:
      offline_version:
        description: Version of the tested production build.
        value: ${{ jobs.foundation.outputs.offline_version }}

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      offline_version: ${{ steps.version.outputs.offline_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:assets
      - run: npx playwright install --with-deps chromium
      - name: Cache verified model and runtime downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            public/models
            public/runtime
          key: calcink-assets-${{ runner.os }}-${{ hashFiles('assets/model-candidates.json', 'package-lock.json', 'scripts/asset-manifest.mjs', 'scripts/model-assets.mjs') }}
      - run: npm run assets:prepare
      - run: npm run assets:verify
      - run: npm run test:e2e -- --workers=2
        env:
          CALCINK_MODEL_TEST: "1"
      - run: npm run build:pages
      - run: npm run build:lab
      - run: npm run verify:production
      - run: npm run test:offline
      - name: Record tested build version
        id: version
        run: |
          node -p "'offline_version=' + JSON.parse(require('node:fs').readFileSync('dist/offline-manifest.json', 'utf8')).version" >> "$GITHUB_OUTPUT"
      - name: Upload tested Pages artifact
        if: inputs.upload_pages && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
